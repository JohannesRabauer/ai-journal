spring.application.name=frontend
# Localhost only by default; containers set JOURNAL_HTTP_HOST=0.0.0.0 and publish on 127.0.0.1.
server.address=${JOURNAL_HTTP_HOST:127.0.0.1}
server.port=${JOURNAL_FRONTEND_PORT:8081}
backend.url=${BACKEND_URL:http://127.0.0.1:8080}
vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:false}
# No usage statistics collection by Vaadin dev tools.
vaadin.devmode.usageStatistics.enabled=false

# ---- W1c
# Calm failure when the backend is down: short connect timeout, read timeout per read (not total) (export streams a zip).
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=30s
