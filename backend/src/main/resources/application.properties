# =====================================================================================
# AI Diary backend. Every key can be overridden by an environment variable
# (journal.stt.provider -> JOURNAL_STT_PROVIDER). Provider reference: docs/CONFIG.md.
# =====================================================================================

# ---- Profile & providers ------------------------------------------------------------
# full       = profiles A (compose) and B (plain Java): local AI only.
# lite-cloud = profile C (Raspberry Pi): OpenAI, explicit opt-in, see docs/PRIVACY.md.
journal.profile=full
# Providers without a real implementation yet default to fake; each worker switches its default when it lands.
journal.stt.provider=whisper
journal.tts.provider=none
journal.llm.provider=ollama
journal.embedding.provider=ollama
journal.vector.provider=jdbc
journal.audio.provider=filesystem
journal.scheduler.provider=sm2

journal.cloud.consent=${JOURNAL_CLOUD_CONSENT:}
journal.openai.api-key=${OPENAI_API_KEY:}
# Provider-specific keys (journal.<capability>.<provider>.*) are read by each provider with defaults and need no
# @ConfigMapping registration (D-016).
smallrye.config.mapping.validate-unknown=false

# ---- HTTP -----------------------------------------------------------------------------
# Localhost only by default. Containers set JOURNAL_HTTP_HOST=0.0.0.0 and publish on 127.0.0.1.
# LAN opt-in (the backend serves the pages now): JOURNAL_HTTP_HOST=0.0.0.0 AND JOURNAL_ALLOWED_HOSTS=<names or IPs you
# type into the browser>. Without the allowed host the Host check answers 421. See docs/CONFIG.md.
quarkus.http.host=${JOURNAL_HTTP_HOST:127.0.0.1}
quarkus.http.port=${JOURNAL_HTTP_PORT:8080}
# The pages and the API share one origin, so the backend needs no CORS.
quarkus.http.cors.enabled=false
quarkus.http.limits.max-body-size=25M

# ---- Database: embedded H2 file database (one file, no server; D-032) -----------------
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${JOURNAL_DB_URL:jdbc:h2:file:./data/journal;DB_CLOSE_ON_EXIT=FALSE}
quarkus.datasource.username=journal
quarkus.datasource.password=
quarkus.datasource.jdbc.max-size=4
# Flyway owns the schema; Hibernate never changes it. Migration runs in StartupValidation right AFTER the
# configuration check, so misconfiguration is reported clearly before any database access.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=false
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# ---- Privacy: never log journal content ----------------------------------------------
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.log.category."dev.rabauer".level=INFO

# ---- OpenAPI ---------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=AI Diary API
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# The API description and Swagger UI exist only while developing (and in the tests): never in prod or lite-cloud.
quarkus.smallrye-openapi.enable=false
quarkus.swagger-ui.always-include=false
quarkus.swagger-ui.enable=false
%dev.quarkus.swagger-ui.enable=true
%test.quarkus.swagger-ui.enable=true
%dev.quarkus.smallrye-openapi.enable=true
%test.quarkus.smallrye-openapi.enable=true

# =====================================================================================
# lite-cloud (Raspberry Pi): same build as everything else, run with QUARKUS_PROFILE=lite-cloud
# =====================================================================================
%lite-cloud.journal.profile=lite-cloud

# =====================================================================================
# Tests: embedded H2, fakes only, no network, no Docker.
# =====================================================================================
%test.journal.profile=full
%test.journal.stt.provider=fake
%test.journal.tts.provider=fake
%test.journal.llm.provider=fake
%test.journal.embedding.provider=fake
%test.journal.vector.provider=memory
%test.journal.audio.provider=memory
%test.journal.scheduler.provider=sm2
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:journal;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
# Entities must match the migrations exactly.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.http.test-port=0

# ---- W1e: chat LLM, embeddings, vector store, backfill -------------------------------
%lite-cloud.journal.llm.provider=openai
%lite-cloud.journal.embedding.provider=openai
%lite-cloud.journal.vector.provider=jdbc

# Provider settings (journal.llm.ollama.*, journal.llm.openai.model, journal.embedding.*) have code defaults; set them here
# or via env (JOURNAL_LLM_OLLAMA_BASE_URL, JOURNAL_EMBEDDING_OLLAMA_BASE_URL, JOURNAL_LLM_OLLAMA_MODEL, ...).

# Backfill of FINISHED entries missing from the current embedding model (runs in the background after startup).
journal.index.backfill.enabled=true
journal.index.backfill.initial-delay=10s
journal.index.backfill.interval=15m
journal.index.backfill.pause=250ms
%test.journal.index.backfill.enabled=false

# ---- W1a: voice capture (recordings, speech-to-text, transcription jobs) ----------------
# Provider and job settings (override by env, e.g. JOURNAL_STT_WHISPER_BASE_URL, JOURNAL_AUDIO_FILESYSTEM_DIRECTORY):
journal.audio.filesystem.directory=./data/audio
journal.stt.whisper.base-url=http://localhost:8000
journal.stt.whisper.model=Systran/faster-whisper-small
journal.stt.whisper.timeout=10m
# openai: gpt-4o-*-transcribe supports json only (language reported as AUTO); whisper-1 gives verbose_json.
journal.stt.openai.model=gpt-4o-mini-transcribe
journal.stt.openai.timeout=5m
# Retryable provider errors only; backoff is the base delay, doubling per attempt (max 1m).
journal.transcription.max-attempts=3
journal.transcription.backoff=5s
journal.transcription.threads=1
journal.transcription.queue-capacity=100
%lite-cloud.journal.stt.provider=openai
%test.journal.transcription.backoff=20ms

# ---- W2b: text to speech (Piper, OpenAI, audio cache) ---------------------------------
# Default stays `none` (D-021): Piper is not present in profile B. With the compose `tts` profile set
# JOURNAL_TTS_PROVIDER=piper. Piper/OpenAI keys (journal.tts.piper.*, journal.tts.openai.*) have defaults in code.
%lite-cloud.journal.tts.provider=openai
journal.tts.cache.directory=${JOURNAL_TTS_CACHE_DIR:./data/tts-cache}
journal.tts.cache.max-entries=${JOURNAL_TTS_CACHE_MAX_ENTRIES:500}
%test.journal.tts.cache.directory=target/tts-cache-test

# ---- W2a: coach -----------------------------------------------------------------------
# Follow-up questions the coach may ask on one opening question before the next planned question is shown.
journal.coach.follow-ups-per-question=1
# Similar past FINISHED entries used as context for the opening questions (0 disables retrieval).
journal.coach.similar-entries=3
# Unvalidated against real embedding models (only tuned with the fake embedder); revisit with real data.
journal.coach.similar-min-score=0.3
# Transcribe-only endpoint (spoken answers): maximum audio size in bytes (10 MB).
journal.coach.transcribe.max-bytes=10485760

# ---- W3b: thinking gym -----------------------------------------------------------------
# Entries matched by embedding search against the category theme (0 disables; the most recent entries are used then).
journal.gym.similar-entries=10
# Unvalidated against real embedding models (only tuned with the fake embedder); revisit with real data.
journal.gym.similar-min-score=0.2
# Total LLM attempts for a personalized exercise (first + corrective retries) before a library template is used.
journal.gym.generation-attempts=2

# ---- W3c: weekly reflection --------------------------------------------------------------
# Characters of one entry / of the coach exchange about one entry sent to the model (the rest is cut).
journal.weekly.max-entry-chars=4000
journal.weekly.max-coach-chars=1500
journal.weekly.temperature=0.3

# ---- W3a: memory (SM-2) ---------------------------------------------------------------
# Review scheduler: sm2 (SPEC section 6). Overrides the earlier `fake` default; tests use sm2 as well.

# ---- W4c: request guard (CSRF header, Origin, Host allowlist) ---------------------------
# Extra Host names accepted besides localhost, 127.0.0.1, [::1] and `backend` (comma list; Pi/LAN opt-in).
journal.http.allowed-hosts=${JOURNAL_ALLOWED_HOSTS:}
# Extra browser origins allowed to call the API. Empty (default). The backend's own origin (http(s)://<Host header>,
# host allowed above) is always accepted, so the pages it serves need no entry here.
journal.http.allowed-origins=

# ---- Web UI (Qute pages) -------------------------------------------------------------
# Port of the previous Vaadin interface on the same host; used by the temporary "not moved yet" pages until phase 5
# of docs/MIGRATION-QUTE.md. Empty: no link.
journal.web.legacy-port=${JOURNAL_FRONTEND_PORT:8081}

# Static assets have no fingerprinted names yet: keep browser caching short so updates show up quickly.
quarkus.http.static-resources.max-age=5M
