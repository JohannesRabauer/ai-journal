gym.title=Denktraining
gym.intro=Kurze Denkübungen von fünf bis zehn Minuten. Wähle eine Kategorie oder lass das Tagebuch eine auswählen. Alles funktioniert ohne KI; steht ein KI-Modell zur Verfügung, können Übungen auf etwas aufbauen, das du geschrieben hast.
gym.pick.title=Was möchtest du üben?
gym.pick.any=\u00dcberrasch mich
gym.pick.anyHelp=Das Tagebuch wählt die Kategorie, die du am längsten nicht geübt hast.
gym.pick.categoriesLabel=Kategorien
gym.category.ASSUMPTION_CHECK=Annahmen prüfen
gym.category.ASSUMPTION_CHECK.desc=Finde die Annahmen hinter etwas, das du gesagt oder gedacht hast, und teste sie.
gym.category.PERSPECTIVE_SHIFT=Perspektivwechsel
gym.category.PERSPECTIVE_SHIFT.desc=Erzähle eine Situation aus der Sicht einer anderen Person nach.
gym.category.REFRAMING=Umdeuten
gym.category.REFRAMING.desc=Finde zwei andere Lesarten desselben Ereignisses.
gym.category.DECISION_REVIEW=Entscheidung prüfen
gym.category.DECISION_REVIEW.desc=Denke eine offene Entscheidung durch: Optionen und Kriterien oder was schiefgehen könnte.
gym.category.SECOND_ORDER_THINKING=Folgen weiterdenken
gym.category.SECOND_ORDER_THINKING.desc=Frage „und dann?“ und verfolge die Folgen einer Entscheidung.
gym.category.BIAS_SPOTTING=Denkfehler erkennen
gym.category.BIAS_SPOTTING.desc=Suche nach einer Denkgewohnheit, die ein Urteil geprägt haben könnte.
gym.category.EXPLAIN_SIMPLY=Einfach erklären
gym.category.EXPLAIN_SIMPLY.desc=Erkläre etwas, das du gelernt hast, in einfachen Worten.
