# Profile A: full local stack. See README.md and docs/CONFIG.md.
#
#   docker compose --profile gpu up --build -d                  # + Ollama and Whisper on an NVIDIA GPU
#   docker compose --profile cpu up --build -d                  # + Ollama and Whisper on CPU
#   docker compose --profile cpu --profile tts up --build -d    # + Piper text-to-speech (also set JOURNAL_TTS_PROVIDER=piper in .env)
#   docker compose up --build -d                                # only the backend (AI services external)
#
# Pick exactly one of gpu / cpu. The one published port (backend: API and web pages, 8080) binds to 127.0.0.1; the AI services
# (ollama, whisper, piper) publish nothing and are reachable only from the other containers. Secrets come from .env only.
# Directories under ./data are created on first start; on Linux create them first
# (mkdir -p data/db data/audio data/tts-cache data/whisper data/piper data/ollama) and set JOURNAL_UID/JOURNAL_GID in .env
# if your user id is not 1001 (backend and piper containers must be able to write there).

x-ollama: &ollama
  image: ollama/ollama:0.20.0
  # No published ports: the backend reaches it as http://ollama:11434 inside the compose network.
  # To debug from the host see docs/CONFIG.md (docker-compose.override.yml).
  volumes:
    - ./data/ollama:/root/.ollama
    - ./ollama/init:/init:ro
  environment:
    - OLLAMA_KEEP_ALIVE=-1
    - OLLAMA_NUM_PARALLEL=2
    - OLLAMA_MAX_LOADED_MODELS=2
    - OLLAMA_MODELS_TO_PULL=${OLLAMA_MODELS_TO_PULL:-qwen3-embedding:0.6b qwen3:1.7b}
  entrypoint: [ "/bin/sh", "/init/run_ollama.sh" ]
  healthcheck:
    test: [ "CMD", "ollama", "list" ]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s
  restart: unless-stopped

x-whisper: &whisper
  # No published ports (backend uses http://whisper:8000), see docs/CONFIG.md to expose it for debugging.
  volumes:
    # Model cache: downloaded once from Hugging Face, then offline.
    - ./data/whisper:/home/ubuntu/.cache/huggingface/hub
  environment:
    - WHISPER_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-small}
  healthcheck:
    # healthy only once the model is cached (the first start downloads it)
    test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models | grep -q \"$$WHISPER_MODEL\"" ]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s
  restart: unless-stopped

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: "${JOURNAL_UID:-1001}:${JOURNAL_GID:-1001}"
    environment:
      # Embedded H2 file database (D-032): one file in the mounted data folder, no database server.
      - JOURNAL_DB_URL=jdbc:h2:file:/data/db/journal;DB_CLOSE_ON_EXIT=FALSE
      - JOURNAL_HTTP_HOST=0.0.0.0
      # Extra Host names accepted besides localhost/127.0.0.1/[::1] (LAN opt-in, docs/CONFIG.md)
      - JOURNAL_ALLOWED_HOSTS=${JOURNAL_ALLOWED_HOSTS:-}
      # Providers (docs/CONFIG.md). TTS defaults to none (D-021); with the tts profile set JOURNAL_TTS_PROVIDER=piper in .env.
      - JOURNAL_STT_PROVIDER=${JOURNAL_STT_PROVIDER:-whisper}
      - JOURNAL_LLM_PROVIDER=${JOURNAL_LLM_PROVIDER:-ollama}
      - JOURNAL_EMBEDDING_PROVIDER=${JOURNAL_EMBEDDING_PROVIDER:-ollama}
      - JOURNAL_VECTOR_PROVIDER=${JOURNAL_VECTOR_PROVIDER:-jdbc}
      - JOURNAL_AUDIO_PROVIDER=${JOURNAL_AUDIO_PROVIDER:-filesystem}
      - JOURNAL_TTS_PROVIDER=${JOURNAL_TTS_PROVIDER:-none}
      - JOURNAL_SCHEDULER_PROVIDER=${JOURNAL_SCHEDULER_PROVIDER:-sm2}
      - JOURNAL_LLM_OLLAMA_MODEL=${JOURNAL_LLM_OLLAMA_MODEL:-qwen3:1.7b}
      - JOURNAL_STT_WHISPER_BASE_URL=${JOURNAL_STT_WHISPER_BASE_URL:-http://whisper:8000}
      - JOURNAL_LLM_OLLAMA_BASE_URL=${JOURNAL_LLM_OLLAMA_BASE_URL:-http://ollama:11434}
      - JOURNAL_EMBEDDING_OLLAMA_BASE_URL=${JOURNAL_EMBEDDING_OLLAMA_BASE_URL:-http://ollama:11434}
      - JOURNAL_TTS_PIPER_BASE_URL=${JOURNAL_TTS_PIPER_BASE_URL:-http://piper:5000}
      - JOURNAL_AUDIO_FILESYSTEM_DIRECTORY=/data/audio
      - JOURNAL_TTS_CACHE_DIR=/data/tts-cache
    volumes:
      - ${JOURNAL_DB_DATA_DIR:-./data/db}:/data/db
      - ${JOURNAL_AUDIO_DATA_DIR:-./data/audio}:/data/audio
      - ./data/tts-cache:/data/tts-cache
    ports:
      - "127.0.0.1:${JOURNAL_BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/system/info || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---- AI services (compose profiles) -------------------------------------------------------------------------
  ollama-gpu:
    <<: *ollama
    profiles: [ "gpu" ]
    networks:
      default:
        aliases: [ ollama ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ollama-cpu:
    <<: *ollama
    profiles: [ "cpu" ]
    networks:
      default:
        aliases: [ ollama ]

  # faster-whisper behind an OpenAI-compatible API (POST /v1/audio/transcriptions). Pinned Speaches image.
  whisper-gpu:
    <<: *whisper
    build:
      context: ./whisper
      args:
        VARIANT: cuda
    profiles: [ "gpu" ]
    networks:
      default:
        aliases: [ whisper ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  whisper-cpu:
    <<: *whisper
    build:
      context: ./whisper
      args:
        VARIANT: cpu
    profiles: [ "cpu" ]
    networks:
      default:
        aliases: [ whisper ]

  piper:
    build:
      context: ./piper
    user: "${JOURNAL_UID:-1001}:${JOURNAL_GID:-1001}"
    profiles: [ "tts" ]
    environment:
      - PIPER_VOICES=${PIPER_VOICES:-de_DE-thorsten-medium en_US-lessac-medium}
    volumes:
      - ./data/piper:/voices
    # No published ports (backend uses http://piper:5000), see docs/CONFIG.md to expose it for debugging.
    restart: unless-stopped
