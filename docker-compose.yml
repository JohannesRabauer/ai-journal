# Profile A (full local). Wave 0 hardening: ports on 127.0.0.1, password from .env, no trust auth.
# Wave 1 (W1d) adds compose profiles (gpu/cpu), whisper and piper services.
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama/data:/root/.ollama
      - ./ollama/init:/init
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    entrypoint: [ "/bin/sh", "/init/run_ollama.sh" ]

  db:
    build:
      context: ./db
    container_name: db
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      - POSTGRES_USER=ai-diary
      - POSTGRES_PASSWORD=${JOURNAL_DB_PASSWORD:?Set JOURNAL_DB_PASSWORD in .env (see .env.example)}
      - POSTGRES_DB=ai-diary
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai-diary -d ai-diary"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./db/data/:/var/lib/postgresql/data/
      - ./db/init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      - JOURNAL_DB_URL=jdbc:postgresql://db:5432/ai-diary
      - JOURNAL_DB_PASSWORD=${JOURNAL_DB_PASSWORD:?Set JOURNAL_DB_PASSWORD in .env}
      - JOURNAL_HTTP_HOST=0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      - BACKEND_URL=http://backend:8080
      - JOURNAL_HTTP_HOST=0.0.0.0
    ports:
      - "127.0.0.1:8081:8081"
